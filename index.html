<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Private Home Assistant App</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f5f7fb;
        --panel: #ffffff;
        --text: #1d2433;
        --muted: #5e697d;
        --accent: #2e6cff;
      }
      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      .container {
        max-width: 720px;
        margin: 80px auto;
        padding: 32px;
        background: var(--panel);
        border-radius: 16px;
        box-shadow: 0 12px 30px rgba(17, 24, 39, 0.08);
      }
      h1 {
        font-size: clamp(2rem, 3vw, 2.8rem);
        margin: 0 0 16px;
      }
      p {
        font-size: 1.05rem;
        line-height: 1.7;
        color: var(--muted);
      }
      a {
        display: inline-block;
        margin-top: 20px;
        text-decoration: none;
        color: var(--accent);
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main class="container">
      <h1>Private app for my household’s Home Assistant</h1>
      <p>This is a small personal app for my home setup.</p>
      <a href="privacy.html">View privacy page</a>
    </main>
  </body>
</html>
